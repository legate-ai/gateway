server:
  port: 8080

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: legate
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 10MB
  config:
    import: "classpath:legate-defaults.yml"

legate:
  providers:
    - name: openai
      type: openai
      base-url: http://localhost:4010
      api-key-env-var: OPENAI_API_KEY
      models:
        - gpt-4o
        - gpt-4o-mini
        - gpt-3.5-turbo
        - gpt-4o-stream
        - gpt-4o-tools
        - gpt-4o-tools-stream
        - gpt-4o-vision
        - gpt-4o-slow
        - text-embedding-3-small
    - name: ollama-local
      type: OLLAMA
      base-url: http://localhost:11434
      models:
        - gemma3:1b
      connect-timeout: 10s
      read-timeout: 120s

  routing:
    aliases:
      local: gemma3:1b
      smart: gpt-4o
      fast: gpt-4o-mini
    default-chain: openai
    fallback-chains:
      openai:
        endpoints:
          - provider: openai
            model: gpt-4o
      ollama:
        endpoints:
          - provider: ollama-local
            model: gemma3:1b

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    enabled: ${legate.tracing.enabled:false}
    sampling:
      probability: ${legate.tracing.sample-rate:1.0}
  otlp:
    tracing:
      endpoint: ${legate.tracing.endpoint:http://localhost:4317}

