{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "legate.fullname" . }}-secrets
  labels:
    {{- include "legate.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  admin-token: {{ .Values.secrets.adminToken | quote }}
{{- end }}
